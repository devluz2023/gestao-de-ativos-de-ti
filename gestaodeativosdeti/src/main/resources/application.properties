spring.application.name=gestaodeativosdeti
# Configuração da Conexão com o PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/meu_banco
spring.datasource.username=meu_usuario
spring.datasource.password=minha_senha
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate
# 'update' atualiza ou cria as tabelas automaticamente com base nas suas entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL executadas no console (ótimo para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do PostgreSQL para o Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect